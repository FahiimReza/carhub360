    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #00d4ff;
            --secondary-color: #ff4081;
            --accent-color: #ffab40;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #ff4081 100%);
        }
    }

    @layer base {
        body {
            @apply text-[var(--text-primary)] font-sans pt-20; /* Increased padding-top to provide more clearance for the fixed header */
            background: var(--bg-primary);
        }
        
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--bg-primary);
        }
    }

    @layer components {
        .glass-card {
            @apply backdrop-blur-sm border border-white/10 rounded-xl transition-all duration-300;
            background: var(--bg-card);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary {
            @apply px-6 py-3 rounded-lg font-semibold transition-all duration-200 text-white;
            background: var(--gradient-primary);
        }
        
        .btn-secondary {
            @apply px-4 py-2 rounded-lg font-semibold border-2 transition-all duration-200;
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: transparent;
        }
    }
    </style>
