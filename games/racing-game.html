<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000000;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .game-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .game-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0, 212, 255, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #00d4ff;
        }
        
        .game-canvas {
            width: 100%;
            flex: 1;
            background: linear-gradient(to bottom, #1a1a1a, #2a2a2a);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            min-height: 300px;
        }
        
        .road {
            position: absolute;
            width: 80%;
            height: 100%;
            left: 10%;
            background: #333;
            overflow: hidden;
        }
        
        .road-line {
            position: absolute;
            width: 10px;
            height: 80px;
            background: #fff;
            left: 50%;
            transform: translateX(-50%);
            animation: roadMove 1s linear infinite;
        }
        
        @keyframes roadMove {
            from { top: -80px; }
            to { top: 100%; }
        }
        
        .player-car {
            position: absolute;
            width: 40px;
            height: 60px;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            transition: left 0.2s ease, transform 0.2s ease;
            z-index: 10;
            background: linear-gradient(135deg, #ff4081, #ff007f);
            border-radius: 10px 10px 5px 5px;
            box-shadow: 0 2px 10px rgba(255, 64, 129, 0.5);
        }
        
        
        .player-car::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 15px;
            background: rgba(0, 212, 255, 0.8);
            top: 10px;
            left: 5px;
            border-radius: 5px;
        }
        
        .player-car::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            bottom: 10px;
            border-radius: 50%;
            box-shadow: 20px 0 0 #fff;
        }
        
        .obstacle {
            position: absolute;
            width: 40px;
            height: 60px;
            animation: obstacleMove 3s linear;
            z-index: 5;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border-radius: 10px 10px 5px 5px;
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.5);
        }
        
        .obstacle::before {
            content: '';
            position: absolute;
            width: 30px;
            height: 15px;
            background: rgba(255, 64, 129, 0.8);
            top: 10px;
            left: 5px;
            border-radius: 5px;
        }
        
        .obstacle::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #fff;
            bottom: 10px;
            border-radius: 50%;
            box-shadow: 20px 0 0 #fff;
        }
        
        @keyframes obstacleMove {
            from { top: -60px; }
            to { top: 100%; }
        }
        
        @keyframes obstacleMoveFromTop {
            from { top: -60px; }
            to { top: 100%; }
        }
        
        @keyframes obstacleMoveFromBottom {
            from { top: 100%; }
            to { top: -60px; }
        }
        
        .game-controls {
            text-align: center;
            padding: 15px 0;
            background: rgba(0, 0, 0, 0.8);
            border-top: 1px solid #00d4ff;
            position: relative;
            z-index: 20;
            width: 100%;
        }
        
        .btn {
            background: linear-gradient(135deg, #00d4ff, #ff4081);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .game-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #00d4ff;
            z-index: 100;
            display: none;
        }
        
        .game-message.show {
            display: block;
            animation: slideUp 0.5s ease;
        }
        
        .instructions {
            text-align: center;
            margin-bottom: 15px;
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translate(-50%, -40%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }
        
        @media (max-width: 480px) {
            .game-header {
                padding: 10px;
            }
            
            .game-title {
                font-size: 1.5rem;
                margin-bottom: 5px;
            }
            
            .instructions {
                font-size: 0.8rem;
                margin-bottom: 5px;
            }
            
            .game-stats {
                padding: 8px 10px;
                font-size: 0.9rem;
            }
            
            .player-car, .obstacle {
                width: 30px;
                height: 45px;
            }
            
            .game-controls {
                padding: 10px 0;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🏁 Car Racing Game</h1>
            <p class="instructions">Click/tap on the left, middle, or right lane to move. Avoid cars coming from the front!</p>
        </div>
        
        <div class="game-stats">
            <div>Score: <span id="score">0</span></div>
            <div>Speed: <span id="speed">1</span>x</div>
            <div>Progress: <span id="progress">0</span>%</div>
            <div>High Score: <span id="highScore">0</span></div>
        </div>
        
        <div class="game-canvas" id="gameCanvas">
            <div class="road" id="road">
                <!-- Road lines will be generated here -->
            </div>
            <div class="player-car" id="playerCar"></div>
            
            <div class="game-message" id="gameMessage">
                <h3 id="messageTitle" style="color: #00d4ff; margin-bottom: 10px;"></h3>
                <p id="messageText"></p>
                <button class="btn" onclick="startGame()">Play Again</button>
            </div>
        </div>
        
        <div class="game-controls">
            <button class="btn" id="startBtn" onclick="startGame()">Start Game</button>
            <button class="btn" id="pauseBtn" onclick="togglePause()" disabled>Pause</button>
        </div>
    </div>

    <script>
        let gameRunning = false;
        let gamePaused = false;
        let score = 0;
        let speed = 1;
        let playerPosition = 50; // percentage
        let obstacles = [];
        let gameLoop = null;
        let obstacleInterval = null;
        let speedInterval = null;
        let highScore = localStorage.getItem('racingHighScore') || 0;
        let currentUser = null;
        
        const gameCanvas = document.getElementById('gameCanvas');
        const playerCar = document.getElementById('playerCar');
        const road = document.getElementById('road');
        const gameMessage = document.getElementById('gameMessage');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        
        // Initialize high score display
        document.getElementById('highScore').textContent = highScore;
        
        // Get current user from localStorage
        function getCurrentUser() {
            try {
                const userStr = localStorage.getItem('currentUser');
                if (userStr) {
                    currentUser = JSON.parse(userStr);
                    return currentUser;
                }
            } catch (e) {
                console.error('Error parsing user data:', e);
            }
            return null;
        }
        
        // Generate coupon based on score
        async function generateCoupon(score) {
            let discount = 5; // Base discount
            let couponType = 'RACING-GAME';
            
            // Calculate discount based on score
            if (score >= 1000) {
                discount = 25; // Perfect score - 25% discount
                couponType = 'RACING-PERFECT';
            } else if (score >= 500) {
                discount = 20; // Excellent - 20% discount
                couponType = 'RACING-EXCELLENT';
            } else if (score >= 300) {
                discount = 15; // Good - 15% discount
                couponType = 'RACING-GOOD';
            } else if (score >= 100) {
                discount = 10; // Average - 10% discount
                couponType = 'RACING-AVERAGE';
            } else {
                discount = 5; // Participation - 5% discount
                couponType = 'RACING-PARTICIPATION';
            }
            
            // Generate unique coupon code
            const timestamp = new Date().getTime();
            const random = Math.floor(Math.random() * 1000);
            const couponCode = `RACE${discount}${timestamp.toString().slice(-4)}${random}`;
            const serialNumber = `RACE-${new Date().getFullYear()}-${String(timestamp).slice(-6)}`;
            
            // Get current user
            const user = getCurrentUser();
            const userId = user ? user.id : null;
            
            // Calculate expiry date (30 days from now)
            const expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + 30);
            
            const couponData = {
                serial_number: serialNumber,
                coupon_code: couponCode,
                game_type: 'racing_game',
                user_id: userId,
                discount_value: discount,
                discount_type: 'percentage',
                min_order_value: discount >= 20 ? 5000 : 3000, // Higher minimum for higher discounts
                max_discount_amount: discount >= 25 ? 10000 : null,
                description: `${discount}% discount from Racing Game - Score: ${score} points`,
                expires_at: expiryDate.toISOString().slice(0, 19).replace('T', ' ')
            };
            
            try {
                // Save coupon to database
                const response = await fetch('/api/coupons/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(couponData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    return { success: true, coupon: couponData, id: result.couponId };
                } else {
                    console.error('Failed to save coupon:', await response.text());
                    return { success: false, coupon: couponData };
                }
            } catch (error) {
                console.error('Error saving coupon:', error);
                // Still return the coupon data even if database save fails
                return { success: false, coupon: couponData };
            }
        }
        
        // Display coupon to user
        function displayCoupon(couponResult) {
            const { coupon, success, id } = couponResult;
            
            // Create coupon display element
            const couponDisplay = document.createElement('div');
            couponDisplay.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
                border: 2px solid #00d4ff;
                border-radius: 15px;
                padding: 30px;
                z-index: 1000;
                text-align: center;
                box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
                max-width: 400px;
                animation: slideUp 0.5s ease;
            `;
            
            couponDisplay.innerHTML = `
                <h3 style="color: #00d4ff; margin-bottom: 15px; font-size: 1.5rem;">🎫 Coupon Earned!</h3>
                <div style="background: rgba(0, 212, 255, 0.1); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px dashed #00d4ff;">
                    <p style="font-size: 1.2rem; font-weight: bold; color: #ff4081; margin: 0;">${coupon.coupon_code}</p>
                </div>
                <p style="margin: 10px 0; color: #ffffff;">${coupon.discount_value}% OFF</p>
                <p style="margin: 10px 0; color: #94a3b8; font-size: 0.9rem;">${coupon.description}</p>
                <p style="margin: 10px 0; color: #94a3b8; font-size: 0.8rem;">Valid until: ${new Date(coupon.expires_at).toLocaleDateString()}</p>
                <p style="margin: 10px 0; color: #94a3b8; font-size: 0.8rem;">Min. order: ৳${coupon.min_order_value}</p>
                ${!success ? '<p style="color: #ff6b6b; font-size: 0.8rem; margin-top: 10px;">⚠️ Coupon saved locally. Please contact support to activate.</p>' : '<p style="color: #4caf50; font-size: 0.8rem; margin-top: 10px;">✅ Coupon saved to your account!</p>'}
                <button onclick="this.parentElement.remove()" style="
                    background: linear-gradient(135deg, #00d4ff, #ff4081);
                    border: none;
                    padding: 10px 20px;
                    border-radius: 20px;
                    color: white;
                    font-weight: 600;
                    cursor: pointer;
                    margin-top: 15px;
                ">Claim Coupon</button>
            `;
            
            document.body.appendChild(couponDisplay);
            
            // Auto-remove after 10 seconds
            setTimeout(() => {
                if (couponDisplay.parentElement) {
                    couponDisplay.remove();
                }
            }, 10000);
        }
        
        function createRoadLines() {
            road.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const line = document.createElement('div');
                line.className = 'road-line';
                line.style.top = `${i * 120}px`;
                line.style.animationDelay = `${i * 0.2}s`;
                road.appendChild(line);
            }
        }
        
        function createObstacle() {
            if (!gameRunning || gamePaused) return;
            
            // Create random lane for obstacle (3 lanes total)
            const lanes = [15, 50, 85]; // Left, middle, right (percentage positions)
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            
            const obstacle = document.createElement('div');
            obstacle.className = 'obstacle';
            obstacle.style.left = `${randomLane}%`;
            obstacle.style.animationDuration = `${2.5 / speed}s`; // Slightly faster
            
            // All obstacles come from top (front)
            obstacle.style.top = '-60px';
            obstacle.style.animationName = 'obstacleMoveFromTop';
            
            gameCanvas.appendChild(obstacle);
            obstacles.push(obstacle);
            
            // Remove obstacle when it goes off screen
            setTimeout(() => {
                if (obstacle.parentNode) {
                    obstacle.remove();
                    obstacles = obstacles.filter(obs => obs !== obstacle);
                    
                    // Increase score for avoiding obstacle
                    if (gameRunning && !gamePaused) {
                        score += 10;
                        updateStats();
                    }
                }
            }, 2500 / speed);
        }
        
        function movePlayer(direction) {
            if (!gameRunning || gamePaused) return;
            
            // Define the three lanes (left, middle, right)
            const lanes = [15, 50, 85];
            
            // Find current lane by checking which position the car is closest to
            const currentLaneIndex = lanes.reduce((prevIdx, currLane, currIdx, arr) => {
                return Math.abs(arr[currIdx] - playerPosition) < Math.abs(arr[prevIdx] - playerPosition) ? currIdx : prevIdx;
            }, 0);
            
            if (direction === 'left') {
                // Move one step to the left if possible
                if (currentLaneIndex > 0) {
                    playerPosition = lanes[currentLaneIndex - 1];
                }
            } else if (direction === 'right') {
                // Move one step to the right if possible
                if (currentLaneIndex < lanes.length - 1) {
                    playerPosition = lanes[currentLaneIndex + 1];
                }
            }
            
            playerCar.style.left = `${playerPosition}%`;
            
            // Add visual feedback
            playerCar.style.transform = 'translateX(-50%) scale(1.1)';
            setTimeout(() => {
                playerCar.style.transform = 'translateX(-50%) scale(1)';
            }, 200);
        }
        
        function movePlayerToPosition(x) {
            if (!gameRunning || gamePaused) return;
            
            // Get the game canvas position
            const canvasRect = gameCanvas.getBoundingClientRect();
            const relativeX = x - canvasRect.left;
            const canvasWidth = canvasRect.width;
            
            // Define the three lanes (left, middle, right)
            const lanes = [15, 50, 85]; // Left, middle, right (percentage positions)
            
            // Find current lane by checking which position the car is closest to
            const currentLaneIndex = lanes.reduce((prevIdx, currLane, currIdx, arr) => {
                return Math.abs(arr[currIdx] - playerPosition) < Math.abs(arr[prevIdx] - playerPosition) ? currIdx : prevIdx;
            }, 0);
            
            // Determine which direction to move based on click position
            const laneWidth = canvasWidth / 3;
            let targetLaneIndex;
            if (relativeX < laneWidth) {
                targetLaneIndex = 0; // Left lane
            } else if (relativeX < laneWidth * 2) {
                targetLaneIndex = 1; // Middle lane
            } else {
                targetLaneIndex = 2; // Right lane
            }
            
            // Move one step at a time toward the target lane
            if (targetLaneIndex < currentLaneIndex) {
                // Move left
                playerPosition = lanes[currentLaneIndex - 1];
            } else if (targetLaneIndex > currentLaneIndex) {
                // Move right
                playerPosition = lanes[currentLaneIndex + 1];
            }
            // If targetLaneIndex == currentLaneIndex, don't move
            
            playerCar.style.left = `${playerPosition}%`;
            
            // Add visual feedback
            playerCar.style.transform = 'translateX(-50%) scale(1.1)';
            setTimeout(() => {
                playerCar.style.transform = 'translateX(-50%) scale(1)';
            }, 200);
        }
        
        function checkCollision() {
            const playerRect = playerCar.getBoundingClientRect();
            
            for (const obstacle of obstacles) {
                const obstacleRect = obstacle.getBoundingClientRect();
                
                if (
                    playerRect.left < obstacleRect.left + obstacleRect.width - 10 &&
                    playerRect.left + playerRect.width - 10 > obstacleRect.left &&
                    playerRect.top < obstacleRect.top + obstacleRect.height - 10 &&
                    playerRect.top + playerRect.height - 10 > obstacleRect.top
                ) {
                    endGame();
                    return;
                }
            }
        }
        
        function updateStats() {
            document.getElementById('score').textContent = score;
            document.getElementById('speed').textContent = speed.toFixed(1);
            document.getElementById('progress').textContent = Math.min(100, Math.floor(score / 10));
        }
        
        function increaseSpeed() {
            if (!gameRunning || gamePaused) return;
            
            speed = Math.min(3, speed + 0.1);
            updateStats();
        }
        
        function startGame() {
            // Reset game state
            gameRunning = true;
            gamePaused = false;
            score = 0;
            speed = 1;
            playerPosition = 50; // Start in middle lane
            
            // Clear any existing obstacles
            obstacles.forEach(obstacle => obstacle.remove());
            obstacles = [];
            
            // Hide game message
            gameMessage.classList.remove('show');
            
            // Update buttons
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            // Reset player position to middle lane
            playerPosition = 50; // Middle lane
            playerCar.style.left = `${playerPosition}%`;
            
            // Update stats
            updateStats();
            
            // Create road lines
            createRoadLines();
            
            // Start game loops
            gameLoop = setInterval(() => {
                if (!gamePaused) {
                    checkCollision();
                    score += 1;
                    updateStats();
                    
                    // Check if player has reached the finish line (1000 points)
                    if (score >= 1000) {
                        winGame();
                    }
                }
            }, 100);
            
            obstacleInterval = setInterval(() => {
                createObstacle();
            }, 1500); // More frequent obstacles for increased difficulty
            
            speedInterval = setInterval(() => {
                increaseSpeed();
            }, 5000);
        }
        
        async function endGame() {
            gameRunning = false;
            gamePaused = false;
            
            // Clear intervals
            clearInterval(gameLoop);
            clearInterval(obstacleInterval);
            clearInterval(speedInterval);
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('racingHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            // Generate and display coupon
            const couponResult = await generateCoupon(score);
            
            // Show game over message
            const messageTitle = document.getElementById('messageTitle');
            const messageText = document.getElementById('messageText');
            
            messageTitle.textContent = '💥 Game Over!';
            messageText.innerHTML = `Your score: ${score} | High Score: ${highScore}<br>
                <span style="color: #00d4ff; font-size: 0.9rem;">🎫 You've earned a coupon!</span>`;
            
            gameMessage.classList.add('show');
            
            // Display coupon popup
            setTimeout(() => {
                displayCoupon(couponResult);
            }, 1000);
            
            // Update buttons
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            pauseBtn.textContent = 'Pause';
        }
        
        async function winGame() {
            gameRunning = false;
            gamePaused = false;
            
            // Clear intervals
            clearInterval(gameLoop);
            clearInterval(obstacleInterval);
            clearInterval(speedInterval);
            
            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('racingHighScore', highScore);
                document.getElementById('highScore').textContent = highScore;
            }
            
            // Generate and display coupon
            const couponResult = await generateCoupon(score);
            
            // Show win message
            const messageTitle = document.getElementById('messageTitle');
            const messageText = document.getElementById('messageText');
            
            messageTitle.textContent = '🏁 You Win!';
            messageText.innerHTML = `Congratulations! You finished the race with a score of ${score}!<br>
                <span style="color: #00d4ff; font-size: 0.9rem;">🎫 You've earned a special coupon!</span>`;
            
            gameMessage.classList.add('show');
            
            // Display coupon popup
            setTimeout(() => {
                displayCoupon(couponResult);
            }, 1000);
            
            // Update buttons
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            pauseBtn.textContent = 'Pause';
        }
        
        function togglePause() {
            if (!gameRunning) return;
            
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? 'Resume' : 'Pause';
            
            // Pause/resume animations
            const roadLines = document.querySelectorAll('.road-line');
            roadLines.forEach(line => {
                line.style.animationPlayState = gamePaused ? 'paused' : 'running';
            });
            
            obstacles.forEach(obstacle => {
                obstacle.style.animationPlayState = gamePaused ? 'paused' : 'running';
            });
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                movePlayer('left');
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                movePlayer('right');
            } else if (e.key === ' ' && gameRunning) {
                e.preventDefault();
                togglePause();
            }
        });
        
        // Mouse controls
        gameCanvas.addEventListener('click', (e) => {
            movePlayerToPosition(e.clientX);
        });
        
        // Touch controls for mobile
        gameCanvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            movePlayerToPosition(touch.clientX);
        });
        
        // Initialize road lines on page load
        window.addEventListener('load', () => {
            createRoadLines();
        });
    </script>
</body>
</html>
