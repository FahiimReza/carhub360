<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Memory Game</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #000000;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        
        .game-container {
            max-width: 500px;
            width: 100%;
        }
        
        .game-header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .game-title {
            font-size: 1.8rem;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        .game-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: rgba(0, 212, 255, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #00d4ff;
        }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .memory-card {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            transition: all 0.3s ease;
            position: relative;
            transform-style: preserve-3d;
        }
        
        .memory-card:hover {
            transform: scale(1.05);
            border-color: #00d4ff;
        }
        
        .memory-card.flipped {
            transform: rotateY(180deg);
        }
        
        .memory-card.matched {
            background: linear-gradient(135deg, #10b981, #059669);
            border-color: #10b981;
            animation: matchPulse 0.5s ease;
        }
        
        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            border-radius: 8px;
        }
        
        .card-front {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            transform: rotateY(180deg);
        }
        
        .card-back {
            background: linear-gradient(135deg, #333, #444);
            border: 2px solid #555;
        }
        
        .card-back::after {
            content: '?';
            font-size: 1.5rem;
            color: #00d4ff;
        }
        
        .game-controls {
            text-align: center;
        }
        
        .btn {
            background: linear-gradient(135deg, #00d4ff, #ff4081);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }
        
        .game-message {
            text-align: center;
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
            border: 1px solid #00d4ff;
            display: none;
        }
        
        .game-message.show {
            display: block;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes matchPulse {
            0% { transform: scale(1) rotateY(180deg); }
            50% { transform: scale(1.1) rotateY(180deg); }
            100% { transform: scale(1) rotateY(180deg); }
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 480px) {
            .memory-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
            }
            
            .memory-card {
                font-size: 1.5rem;
            }
            
            .game-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1 class="game-title">🧠 Car Memory Game</h1>
            <p style="color: #94a3b8; font-size: 0.9rem;">Match all the car pairs to win!</p>
        </div>
        
        <div class="game-stats">
            <div>Moves: <span id="moves">0</span></div>
            <div>Time: <span id="timer">0:00</span></div>
            <div>Matches: <span id="matches">0</span>/6</div>
        </div>
        
        <div class="memory-grid" id="gameGrid">
            <!-- Cards will be generated here -->
        </div>
        
        <div class="game-controls">
            <button class="btn" onclick="initGame()">New Game</button>
        </div>
        
        <div class="game-message" id="gameMessage">
            <h3 id="messageTitle" style="color: #00d4ff; margin-bottom: 10px;"></h3>
            <p id="messageText"></p>
        </div>
    </div>

    <script>
        const cardSymbols = ['🚗', '🚕', '🚙', '🏎️', '🚓', '🚑'];
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let gameTimer = null;
        let seconds = 0;
        let isProcessing = false;
        
        function createBoard() {
            const gameGrid = document.getElementById('gameGrid');
            gameGrid.innerHTML = '';
            
            // Create pairs of cards
            cards = [...cardSymbols, ...cardSymbols]
                .sort(() => Math.random() - 0.5)
                .map((symbol, index) => ({
                    id: index,
                    symbol: symbol,
                    flipped: false,
                    matched: false
                }));
            
            // Create card elements
            cards.forEach(card => {
                const cardElement = document.createElement('div');
                cardElement.className = 'memory-card';
                cardElement.dataset.id = card.id;
                cardElement.innerHTML = `
                    <div class="card-back"></div>
                    <div class="card-front">${card.symbol}</div>
                `;
                cardElement.addEventListener('click', () => flipCard(card.id));
                gameGrid.appendChild(cardElement);
            });
        }
        
        function flipCard(cardId) {
            if (isProcessing) return;
            
            const card = cards[cardId];
            if (card.flipped || card.matched) return;
            
            card.flipped = true;
            flippedCards.push(card);
            
            const cardElement = document.querySelector(`[data-id="${cardId}"]`);
            cardElement.classList.add('flipped');
            
            if (flippedCards.length === 2) {
                isProcessing = true;
                moves++;
                updateStats();
                checkMatch();
            }
        }
        
        function checkMatch() {
            const [card1, card2] = flippedCards;
            
            if (card1.symbol === card2.symbol) {
                // Match found
                card1.matched = card2.matched = true;
                
                const cardElement1 = document.querySelector(`[data-id="${card1.id}"]`);
                const cardElement2 = document.querySelector(`[data-id="${card2.id}"]`);
                
                cardElement1.classList.add('matched');
                cardElement2.classList.add('matched');
                
                matchedPairs++;
                updateStats();
                
                if (matchedPairs === cardSymbols.length) {
                    endGame(true);
                }
                
                flippedCards = [];
                isProcessing = false;
            } else {
                // No match
                setTimeout(() => {
                    card1.flipped = card2.flipped = false;
                    
                    const cardElement1 = document.querySelector(`[data-id="${card1.id}"]`);
                    const cardElement2 = document.querySelector(`[data-id="${card2.id}"]`);
                    
                    cardElement1.classList.remove('flipped');
                    cardElement2.classList.remove('flipped');
                    
                    flippedCards = [];
                    isProcessing = false;
                }, 1000);
            }
        }
        
        function updateStats() {
            document.getElementById('moves').textContent = moves;
            document.getElementById('matches').textContent = matchedPairs;
        }
        
        function updateTimer() {
            seconds++;
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            document.getElementById('timer').textContent = `${minutes}:${secs.toString().padStart(2, '0')}`;
        }
        
        function startTimer() {
            gameTimer = setInterval(updateTimer, 1000);
        }
        
        function stopTimer() {
            clearInterval(gameTimer);
        }
        
        function endGame(won) {
            stopTimer();
            
            const messageDiv = document.getElementById('gameMessage');
            const titleElement = document.getElementById('messageTitle');
            const textElement = document.getElementById('messageText');
            
            if (won) {
                titleElement.textContent = '🎉 Congratulations!';
                textElement.innerHTML = `You completed the game in ${moves} moves and ${Math.floor(seconds / 60)}:${(seconds % 60).toString().padStart(2, '0')}!<br><span style="color: #00d4ff;">Generating your coupon...</span>`;
                
                // Generate coupon from server
                generateCoupon();
            }
            
            messageDiv.classList.add('show');
        }
        
        async function generateCoupon() {
            try {
                const response = await fetch('/api/coupons/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        game_type: 'memory_game',
                        moves: moves,
                        time_seconds: seconds,
                        user_id: null // Can be updated later if user is logged in
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const coupon = data.coupon;
                    const textElement = document.getElementById('messageText');
                    textElement.innerHTML = `
                        You completed the game in ${moves} moves and ${Math.floor(seconds / 60)}:${(seconds % 60).toString().padStart(2, '0')}!<br>
                        <div style="margin-top: 15px; padding: 15px; background: rgba(0, 212, 255, 0.1); border: 1px solid #00d4ff; border-radius: 8px;">
                            <h4 style="color: #00d4ff; margin-bottom: 10px;">🎁 Your Coupon:</h4>
                            <p style="margin: 5px 0;"><strong>Code:</strong> <span style="color: #ff4081; font-weight: bold; font-size: 1.1em;">${coupon.code}</span></p>
                            <p style="margin: 5px 0;"><strong>Discount:</strong> ${coupon.discount_value}% OFF</p>
                            <p style="margin: 5px 0; font-size: 0.9em; color: #94a3b8;">${coupon.description}</p>
                            <p style="margin: 5px 0; font-size: 0.8em; color: #ff9800;">Expires: ${new Date(coupon.expiry_date).toLocaleDateString()}</p>
                        </div>
                        <p style="margin-top: 10px; font-size: 0.9em; color: #94a3b8;">Save this coupon code for your next purchase!</p>
                    `;
                } else {
                    const textElement = document.getElementById('messageText');
                    textElement.innerHTML = `You completed the game in ${moves} moves and ${Math.floor(seconds / 60)}:${(seconds % 60).toString().padStart(2, '0')}!<br><span style="color: #ff9800;">Failed to generate coupon. Please try again.</span>`;
                }
            } catch (error) {
                console.error('Error generating coupon:', error);
                const textElement = document.getElementById('messageText');
                textElement.innerHTML = `You completed the game in ${moves} moves and ${Math.floor(seconds / 60)}:${(seconds % 60).toString().padStart(2, '0')}!<br><span style="color: #ff9800;">Failed to generate coupon. Please try again.</span>`;
            }
        }
        
        function initGame() {
            // Reset game state
            matchedPairs = 0;
            moves = 0;
            seconds = 0;
            flippedCards = [];
            isProcessing = false;
            
            // Clear timer
            stopTimer();
            
            // Hide message
            document.getElementById('gameMessage').classList.remove('show');
            
            // Reset stats
            updateStats();
            document.getElementById('timer').textContent = '0:00';
            
            // Create new board
            createBoard();
            
            // Start timer
            startTimer();
        }
        
        // Initialize game when page loads
        window.addEventListener('load', initGame);
    </script>
</body>
</html>
