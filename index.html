    <style type="text/tailwindcss">
    @layer theme {
        :root {
            /* Pure OLED Dark Mode Colors */
            --primary-color: #00d4ff;
            --secondary-color: #ff4081;
            --accent-color: #ffab40;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #ff4081 100%);
        }
    }

    @layer base {
        body {
            @apply text-[var(--text-primary)] font-sans;
            background: var(--bg-primary);
        }
        
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--bg-primary);
        }
    }

    @layer components {
        .glass-card {
            @apply backdrop-blur-sm border border-white/10 rounded-xl transition-all duration-300;
            background: var(--bg-card);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary {
            @apply px-6 py-3 rounded-lg font-semibold transition-all duration-200 text-white;
            background: var(--gradient-primary);
        }
        
        .btn-secondary {
            @apply px-6 py-3 rounded-lg font-semibold border-2 transition-all duration-200;
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: transparent;
        }
        
        .btn-accent {
            @apply px-6 py-3 rounded-lg font-semibold transition-all duration-200 text-white;
            background: var(--accent-color);
        }
        
        .car-card {
            @apply glass-card p-6 transition-all duration-300 cursor-pointer;
        }
        
        .car-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 212, 255, 0.2);
        }
    }

    @layer utilities {
        .text-shadow {
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }
    }
    </style>
    
    <style>
      @keyframes slide-up {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up {
        animation: slide-up 0.6s ease-out forwards;
      }
      
      @keyframes floating {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .floating-animation {
        animation: floating 3s ease-in-out infinite;
      }
      
      @keyframes pulse-scale {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .animate-pulse-scale {
        animation: pulse-scale 2s ease-in-out infinite;
      }
      
      .hover-shine::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
      }
      .hover-shine:hover::before {
        left: 100%;
      }
      
      .hover-lift {
        transition: all 0.3s ease;
      }
      .hover-lift:hover {
        transform: translateY(-2px);
      }
      
      .hover-glow {
        transition: all 0.3s ease;
      }
      .hover-glow:hover {
        box-shadow: 0 4px 20px rgba(0, 212, 255, 0.3);
      }
      
      .magnetic-effect {
        transition: transform 0.1s ease-out;
