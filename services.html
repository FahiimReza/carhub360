    <style type="text/tailwindcss">
    @layer theme {
        :root {
            /* OLED Dark Mode Colors - Applied Globally */
            --primary-color: #00d4ff;
            --secondary-color: #ff4081;
            --accent-color: #ffab40;
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --bg-card: rgba(255, 255, 255, 0.03);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --gradient-primary: linear-gradient(135deg, #00d4ff 0%, #ff4081 50%, #ffab40 100%);
            --gradient-hero: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(255, 64, 129, 0.05) 50%, rgba(255, 171, 64, 0.05) 100%);
            --gradient-card: linear-gradient(145deg, rgba(255, 255, 255, 0.02) 0%, rgba(0, 212, 255, 0.03) 100%);
        }
    }

    @layer base {
        html {
            transition: all 0.3s ease;
        }
        
        body {
            @apply text-[var(--text-primary)] font-sans transition-all duration-500;
            background: var(--bg-primary);
            position: relative;
            overflow-x: hidden;
        }
        

        
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) var(--bg-primary);
        }
    }

    @layer components {
        .glass-card {
            @apply backdrop-blur-sm border border-white/10 rounded-xl transition-all duration-300;
            background: var(--bg-card);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary {
            @apply px-6 py-3 rounded-lg font-semibold transition-all duration-200 text-white;
            background: var(--gradient-primary);
        }
        
        .btn-secondary {
            @apply px-6 py-3 rounded-lg font-semibold border-2 transition-all duration-200;
            border-color: var(--primary-color);
            color: var(--primary-color);
            background: transparent;
        }
        
        .btn-accent {
            @apply px-6 py-3 rounded-lg font-semibold transition-all duration-200 text-white;
            background: var(--accent-color);
        }
    }

    @layer utilities {
        .text-shadow {
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .animate-gradient {
            background-size: 200% 200%;
            animation: gradient 4s ease infinite;
        }
        
        @keyframes gradient {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes glow {
            0%, 100% {
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(0, 212, 255, 0.6);
            }
        }

        @keyframes pulse-scale {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        @keyframes rotate-slow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .animate-slide-up {
            animation: slideInUp 0.8s ease-out forwards;
        }

        .animate-slide-left {
            animation: slideInLeft 0.8s ease-out forwards;
        }

        .animate-slide-right {
            animation: slideInRight 0.8s ease-out forwards;
        }

        .animate-glow {
            animation: glow 2s ease-in-out infinite;
        }

        .animate-pulse-scale {
            animation: pulse-scale 2s ease-in-out infinite;
        }

        .animate-rotate-slow {
            animation: rotate-slow 8s linear infinite;
        }

        .hover-lift {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hover-lift:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 212, 255, 0.3);
        }

        .hover-tilt {
            transition: transform 0.3s ease-in-out;
        }

        .hover-tilt:hover {
            transform: perspective(1000px) rotateX(10deg) rotateY(-5deg);
        }

        .hover-glow {
            transition: all 0.3s ease-in-out;
        }

        .hover-glow:hover {
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
            transform: scale(1.02);
        }

        .hover-shine {
            position: relative;
            overflow: hidden;
        }

        .hover-shine::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .hover-shine:hover::before {
            left: 100%;
        }

        .magnetic-effect {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .parallax-bg {
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        #ripple-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            opacity: 0.6;
            background: linear-gradient(135deg, 
                rgba(0, 102, 204, 0.02) 0%, 
                rgba(233, 30, 99, 0.02) 50%, 
                rgba(255, 87, 34, 0.02) 100%);
        }
    }
    </style>
</head>
